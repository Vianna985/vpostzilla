<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPOSTZILLA V7 - COM AUDIO</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<header class="p-4 border-b border-white/10 flex justify-between"><b>🦖 VPOSTZILLA V7</b><span class="text-xs bg-[#A3FF12] text-black px-2 py-1 rounded-full font-black">COM AUDIO + IMAGEM</span></header>
<div class="max-w-6xl mx-auto p-4">
<div class="bg-white text-black rounded-[2rem] p-6">
<h2 class="font-black">🎬 CRIAR VÍDEO ÉPICO - GOKU NO ESPAÇO</h2>
<div class="grid md:grid-cols-3 gap-2 mt-3">
<input id="tema" value="GOKU FOI PARAR NO ESPAÇO" class="bg-zinc-100 border-2 border-black rounded-xl px-3 py-3 font-black text-sm uppercase">
<input type="file" id="imgUpload" accept="image/*" class="bg-zinc-100 border-2 rounded-xl px-3 py-2 text-xs">
<button onclick="criar()" class="bg-black text-white font-black py-3 rounded-full">🚀 CRIAR COM AUDIO</button>
</div>
<p class="text-xs text-zinc-500 mt-2">DICA: Se aparecer file.enc, salve a imagem do Goku como JPG normal antes. Ou use a imagem padrão já dentro do site.</p>
<div id="area" class="hidden mt-4 grid lg:grid-cols-[360px_1fr] gap-4">
<div class="bg-black rounded-2xl p-2">
<canvas id="c" width="1080" height="1920" class="w-full aspect-[9/16] rounded-xl bg-[#0a0a2a]"></canvas>
<div class="grid grid-cols-2 gap-2 mt-2">
<button onclick="baixar()" class="bg-[#A3FF12] text-black font-black py-3 rounded-full text-sm">⬇️ BAIXAR VIDEO</button>
<button onclick="tocarAudio()" class="bg-white text-black font-black py-3 rounded-full text-sm">🔊 TOCAR AUDIO</button>
</div>
</div>
<div>
<div class="bg-zinc-50 border rounded-xl p-3 text-sm">
<p class="font-black">ROTEIRO COM AUDIO:</p>
<div id="roteiro"></div>
<div id="legenda" class="mt-2 bg-[#A3FF12] p-2 rounded-xl font-bold text-xs"></div>
</div>
</div>
</div>
</div>
</div>
<script>
let img=new Image(); let imgLoaded=false; let blob=null; let rec=null; let chunks=[];
img.crossOrigin="anonymous";
img.src="https://images.unsplash.com/photo-1464802686167-b939a6910659?w=1080&h=1920&fit=crop"; // imagem espaço fallback
img.onload=()=>{imgLoaded=true};

document.getElementById('imgUpload').onchange=e=>{
 const f=e.target.files[0]; if(!f) return;
 const url=URL.createObjectURL(f);
 img=new Image(); img.onload=()=>{imgLoaded=true; console.log("imagem carregada")}; img.src=url;
};

function criar(){
 const tema=document.getElementById('tema').value.toUpperCase();
 document.getElementById('area').classList.remove('hidden');
 const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
 let fr=0; const total=300;
 function draw(){
  ctx.clearRect(0,0,1080,1920);
  if(imgLoaded){
   const zoom=1+fr*0.001; const w=1080*zoom, h=1920*zoom;
   ctx.drawImage(img, (1080-w)/2, (1920-h)/2, w, h);
  }
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,1080,1920);
  ctx.textAlign='center'; ctx.strokeStyle='black'; ctx.lineWidth=12;
  ctx.font='900 58px Arial'; const lines=tema.match(/.{1,22}(\s|$)/g)||[tema];
  lines.forEach((l,i)=>{
   const y=450+i*65; ctx.strokeText(l.trim(),540,y); ctx.fillStyle='white'; ctx.fillText(l.trim(),540,y);
  });
  ctx.font='900 66px Arial'; ctx.strokeText('★ PODER MAXIMO ★',540,650); ctx.fillStyle='#A3FF12'; ctx.fillText('★ PODER MAXIMO ★',540,650);
  ctx.fillStyle='#A3FF12'; ctx.fillRect(0,1880,(fr/total)*1080,40);
  fr++; if(fr<total) requestAnimationFrame(draw);
 }
 draw(); gravar(); tocarAudio();
 document.getElementById('roteiro').innerHTML=`<p><b>0-2s:</b> ${tema}</p><p><b>2-6s:</b> KAMEHAMEHA NIVEL DEUS NO ESPAÇO!</p><p><b>6-10s:</b> COMENTA KAMEHAMEHA!</p>`;
 document.getElementById('legenda').innerHTML=`${tema} 🌌 Comenta KAMEHAMEHA 👇 #goku #viral`;
}

function tocarAudio(){
 const tema=document.getElementById('tema').value;
 const utter=new SpeechSynthesisUtterance(`${tema}. Kamehameha no espaço, nível deus! Comenta Kamehameha que te mando a parte 2!`);
 utter.lang='pt-BR'; utter.rate=1.1; utter.pitch=1.2; speechSynthesis.speak(utter);
}

function gravar(){
 const canvas=document.getElementById('c'); const stream=canvas.captureStream(30);
 // cria audio falso pra gravar junto (ruído épico)
 const ac=new (window.AudioContext||window.webkitAudioContext)(); const dest=ac.createMediaStreamDestination();
 const osc=ac.createOscillator(); osc.frequency.value=80; const gain=ac.createGain(); gain.gain.value=0.1; osc.connect(gain); gain.connect(dest); osc.start();
 stream.addTrack(dest.stream.getAudioTracks()[0]);
 chunks=[]; rec=new MediaRecorder(stream,{mimeType:'video/webm'}); rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data)}; rec.onstop=()=>{blob=new Blob(chunks,{type:'video/webm'})}; rec.start(); setTimeout(()=>{if(rec&&rec.state=='recording'){rec.stop(); osc.stop();}},10000);
}
function baixar(){ if(!blob){alert('Gravando video com imagem... espera 3s'); setTimeout(baixar,1500); return;} const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='goku-espaco-com-imagem-e-audio.webm'; a.click(); }
</script>
</body>
</html>
