<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVELEIRO - Pessoas & Animações</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif} .bebas{font-family:'Bebas Neue'}</style>
</head>
<body class="bg-black text-white">
<header class="p-4 border-b border-white/10 flex justify-between max-w-7xl mx-auto">
<b class="text-xl">🎭 NOVELEIRO <span class="text-[#A3FF12]">V9</span></b>
<span class="bg-white text-black px-3 py-1 rounded-full text-xs font-black">PESSOAS + ANIMAÇÃO</span>
</header>

<div class="max-w-7xl mx-auto p-4 grid lg:grid-cols-[400px_360px_1fr] gap-4">
<!-- CRIADOR -->
<div class="bg-zinc-900 rounded-[2rem] p-5 border border-white/10">
<h2 class="font-black">1. PERSONAGENS</h2>
<div class="grid grid-cols-2 gap-2 mt-3">
<label class="bg-white text-black rounded-xl p-3 text-center cursor-pointer border-2 border-black">
<span class="text-xs font-black block">PESSOA 1</span><span class="text-2xl">👩</span>
<input type="file" id="p1" accept="image/*" class="hidden" onchange="loadImg(event,0)">
</label>
<label class="bg-white text-black rounded-xl p-3 text-center cursor-pointer border-2 border-black">
<span class="text-xs font-black block">PESSOA 2</span><span class="text-2xl">👨</span>
<input type="file" id="p2" accept="image/*" class="hidden" onchange="loadImg(event,1)">
</label>
<label class="bg-white text-black rounded-xl p-3 text-center cursor-pointer border-2 border-black">
<span class="text-xs font-black block">PESSOA 3</span><span class="text-2xl">👵</span>
<input type="file" id="p3" accept="image/*" class="hidden" onchange="loadImg(event,2)">
</label>
<div class="bg-zinc-800 rounded-xl p-2">
<select id="estilo" class="w-full bg-transparent text-xs font-bold">
<option value="real">🎥 Pessoas Reais</option>
<option value="anime">✨ Animação Anime</option>
<option value="3d">🧸 Animação 3D Pixar</option>
<option value="goku">🔥 Dragon Ball (Goku)</option>
</select>
</div>
</div>

<h2 class="font-black mt-5">2. TEMA DA NOVELA</h2>
<select id="tema" class="w-full mt-2 bg-white text-black border-2 border-black rounded-xl px-3 py-3 font-black text-xs">
<option>Menina rica descobre que namorado é pobre e a enganou</option>
<option>Grávida descobre que marido tem outra família</option>
<option>Filha encontra mãe que a abandonou há 20 anos</option>
<option>Patrão se apaixona pela empregada e mulher descobre</option>
<option>Amiga rouba namorado e finge que nada aconteceu</option>
<option>Custom - digitar</option>
</select>
<input id="temaCustom" placeholder="Digite sua história..." class="w-full mt-2 bg-zinc-800 border rounded-xl px-3 py-2 text-xs hidden">

<button onclick="gerar()" class="w-full mt-4 bg-[#A3FF12] text-black font-black py-4 rounded-full">🎬 GERAR NOVELA VIRAL</button>
<button onclick="criarVideo()" class="w-full mt-2 bg-white text-black font-black py-3 rounded-full">🚀 CRIAR VÍDEO COM PESSOAS</button>
</div>

<!-- CANVAS -->
<div class="bg-zinc-900 rounded-[2rem] p-3 border border-white/10">
<canvas id="c" width="1080" height="1920" class="w-full aspect-[9/16] rounded-[1.5rem] bg-zinc-800"></canvas>
<div class="grid grid-cols-2 gap-2 mt-3">
<button onclick="baixar()" class="bg-[#A3FF12] text-black font-black py-3 rounded-full text-xs">⬇️ BAIXAR VÍDEO</button>
<button onclick="falar()" class="bg-white text-black font-black py-3 rounded-full text-xs">🔊 ÁUDIO DRAMA</button>
</div>
</div>

<!-- ROTEIRO -->
<div class="bg-white text-black rounded-[2rem] p-5 border-2 border-black">
<h2 class="font-black bebas text-2xl">ROTEIRO 10s</h2>
<div id="roteiro" class="mt-3 space-y-2 text-xs font-bold"></div>
<div id="legenda" class="mt-4 bg-black text-white p-3 rounded-xl text-xs"></div>
<div class="mt-4">
<p class="font-black text-xs">DICAS VIRAL:</p>
<p class="text-[11px] mt-1 text-zinc-600">Use CapCut depois: coloque voz de mulher chorando, música triste, e legenda automática grande. Poste 3x por dia com essa fórmula que pega 1M views.</p>
</div>
</div>
</div>

<script>
let imgs=[null,null,null]; let imgLoaded=[false,false,false];
function loadImg(e, idx){
 const f=e.target.files[0]; const url=URL.createObjectURL(f);
 const im=new Image(); im.onload=()=>{imgs[idx]=im; imgLoaded[idx]=true;}; im.src=url;
}
document.getElementById('tema').onchange=(e)=>{document.getElementById('temaCustom').classList.toggle('hidden', !e.target.value.includes('Custom'))}

let blob=null, rec=null, chunks=[]; let temaAtual="";

function gerar(){
 let t=document.getElementById('tema').value; if(t.includes('Custom')) t=document.getElementById('temaCustom').value||'Traição descoberta';
 temaAtual=t; const estilo=document.getElementById('estilo').value;
 const roteiros=[
  `0-2s: 😱 "${t.toUpperCase()}" - TUDO COMEÇOU ASSIM...`,
  `2-5s: 💔 PESSOA 1 DESCOBRE A VERDADE E CHORA MUITO`,
  `5-8s: 🤬 PESSOA 2 TENTA SE EXPLICAR: "NÃO É O QUE VOCÊ PENSA!"`,
  `8-10s: 👇 COMENTA QUEM TÁ CERTO? PARTE 2 SÓ AMANHÃ!`
 ];
 document.getElementById('roteiro').innerHTML=roteiros.map(r=>`<div class="bg-zinc-100 border-2 border-black rounded-xl p-2">${r}</div>`).join('');
 document.getElementById('legenda').innerHTML=`LEGENDA: ${t} 😭 Você perdoaria? Comenta 👇 #novela #drama #viral #${estilo}`;
 criarVideo();
}

function criarVideo(){
 const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
 let fr=0; const total=300;
 function draw(){
  ctx.clearRect(0,0,1080,1920);
  // fundo novela
  const g=ctx.createLinearGradient(0,0,0,1920); g.addColorStop(0,'#1a1a1a'); g.addColorStop(1,'#000'); ctx.fillStyle=g; ctx.fillRect(0,0,1080,1920);
  // desenha pessoas com zoom dramático
  if(imgs[0]&&imgLoaded[0]){
   const zoom=1+fr*0.0008; const w=520*zoom, h=700*zoom;
   ctx.drawImage(imgs[0], 20-(w-520)/2, 300-(h-700)/2, w, h);
   ctx.strokeStyle='white'; ctx.lineWidth=6; ctx.strokeRect(20,300,520,700);
  } else {
   ctx.fillStyle='#333'; ctx.fillRect(20,300,520,700); ctx.font='100px Arial'; ctx.fillText('👩',180,700);
  }
  if(imgs[1]&&imgLoaded[1]){
   const zoom=1+fr*0.001; const w=520*zoom, h=700*zoom;
   ctx.drawImage(imgs[1], 540-(w-520)/2, 1100-(h-700)/2, w, h);
   ctx.strokeStyle='#A3FF12'; ctx.lineWidth=6; ctx.strokeRect(540,1100,520,700);
  } else {
   ctx.fillStyle='#222'; ctx.fillRect(540,1100,520,700); ctx.font='100px Arial'; ctx.fillText('👨',700,1500);
  }
  // balão drama
  ctx.fillStyle='white'; ctx.strokeStyle='black'; ctx.lineWidth=8; ctx.beginPath(); ctx.roundRect(30,30,1020,220,20); ctx.fill(); ctx.stroke();
  ctx.fillStyle='black'; ctx.font='900 38px Inter'; ctx.textAlign='center';
  const lines=(temaAtual||'DRAMA TOTAL').match(/.{1,32}(\s|$)/g)||['DRAMA'];
  lines.slice(0,3).forEach((l,i)=>ctx.fillText(l.trim().toUpperCase(),540,90+i*55));
  ctx.font='900 60px Bebas Neue'; ctx.fillStyle='#A3FF12'; ctx.strokeStyle='black'; ctx.lineWidth=8;
  ctx.strokeText('PARTE 1',540,1050); ctx.fillText('PARTE 1',540,1050);
  ctx.fillStyle='#A3FF12'; ctx.fillRect(0,1880,(fr/total)*1080,40);
  fr=(fr+1)%total; if(fr<total) requestAnimationFrame(draw);
 }
 draw(); gravar();
}

function falar(){
 const u=new SpeechSynthesisUtterance(temaAtual+'. Você não vai acreditar no que aconteceu... Comenta quem tá certo e veja a parte 2!');
 u.lang='pt-BR'; u.rate=1.1; speechSynthesis.speak(u);
}
function gravar(){
 const canvas=document.getElementById('c'); const stream=canvas.captureStream(30);
 const ac=new (window.AudioContext||window.webkitAudioContext)(); const dest=ac.createMediaStreamDestination();
 try{ stream.addTrack(dest.stream.getAudioTracks()[0]); }catch(e){}
 chunks=[]; rec=new MediaRecorder(stream,{mimeType:'video/webm'}); rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data)}; rec.onstop=()=>{blob=new Blob(chunks,{type:'video/webm'})}; rec.start(); setTimeout(()=>{if(rec&&rec.state=='recording')rec.stop()},10000);
}
function baixar(){ if(!blob){alert('Gravando video... espera 2s'); setTimeout(baixar,1000); return;} const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='novela-pessoas.webm'; a.click(); }
</script>
</body>
</html>
