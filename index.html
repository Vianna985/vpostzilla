<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor - Igual CapCut</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F0F0F] text-white h-screen flex flex-col">

<header class="h-14 bg-[#1A1A1A] border-b border-white/10 flex justify-between items-center px-4">
<b>✂️ EDITOR</b>
<button onclick="exportar()" class="bg-white text-black font-black px-6 py-2 rounded-full text-sm">Exportar</button>
</header>

<div class="flex flex-1 overflow-hidden">
<!-- esquerda -->
<div class="w-[70px] bg-[#1A1A1A] border-r border-white/10 flex flex-col items-center py-4 gap-5 text-[10px] font-bold">
<button onclick="document.getElementById('up').click()">📁<br>Mídia</button>
<button onclick="addTexto()">🔤<br>Texto</button>
<button onclick="document.getElementById('audio').click()">🎵<br>Áudio</button>
<input type="file" id="up" accept="video/*,image/*" multiple class="hidden" onchange="load(event)">
<input type="file" id="audio" accept="audio/*" class="hidden" onchange="loadAudio(event)">
</div>

<!-- preview -->
<div class="flex-1 flex flex-col">
<div class="flex-1 bg-black flex items-center justify-center p-4">
<canvas id="c" width="720" height="1280" class="h-[60vh] aspect-[9/16] bg-zinc-900 rounded-xl border border-white/10"></canvas>
<video id="v" class="hidden"></video>
</div>

<div class="h-[180px] bg-[#1A1A1A] border-t border-white/10 p-2">
<div class="flex gap-3 items-center">
<input type="range" id="time" min="0" max="100" value="0" class="flex-1 accent-white" oninput="seek(this.value)">
<button onclick="play()" id="btn" class="bg-white text-black w-8 h-8 rounded-full font-black">▶</button>
</div>
<div id="timeline" class="mt-3 h-12 bg-black rounded-xl border border-white/10 p-1 flex gap-1 overflow-x-auto"></div>
</div>
</div>

<!-- direita -->
<div class="w-[260px] bg-[#181818] border-l border-white/10 p-4">
<p class="font-black text-xs">TEXTO</p>
<input id="txt" placeholder="Digite..." class="w-full mt-2 bg-black border border-white/10 rounded-xl px-3 py-3 text-xs" oninput="txt(this.value)">
<button onclick="legenda()" class="w-full mt-3 bg-white text-black font-black py-3 rounded-full text-xs">Legenda Automática</button>
</div>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), video=document.getElementById('v');
let textos=[], playing=false, dur=10, rec=null, chunks=[], audioEl=null;

function load(e){
 for(const f of e.target.files){
  const url=URL.createObjectURL(f);
  const type=f.type.startsWith('video')?'video':'image';
  if(type=='video'){ video.src=url; video.onloadedmetadata=()=>dur=video.duration; }
  else { const img=new Image(); img.onload=()=>{ctx.clearRect(0,0,720,1280); ctx.drawImage(img,0,0,720,1280); draw()}; img.src=url; }
  const el=document.createElement('div'); el.className='bg-white text-black text-[10px] font-black px-3 py-2 rounded-lg'; el.textContent=f.name.slice(0,15); document.getElementById('timeline').appendChild(el);
 }
}
function addTexto(){ const t=prompt('Texto:'); if(!t) return; textos.push({t,x:360,y:1100,s:60}); draw(); }
function txt(v){ if(textos.length==0) textos.push({t:v,x:360,y:1100,s:60}); else textos[0].t=v; draw(); }
function draw(){ ctx.clearRect(0,0,720,1280); if(video.src && video.readyState>=2) ctx.drawImage(video,0,0,720,1280); textos.forEach(o=>{ctx.font=`900 ${o.s}px Inter`; ctx.textAlign='center'; ctx.lineWidth=8; ctx.strokeStyle='black'; ctx.strokeText(o.t.toUpperCase(),o.x,o.y); ctx.fillStyle='white'; ctx.fillText(o.t.toUpperCase(),o.x,o.y);}); }
function play(){ if(video.paused){video.play(); playing=true; document.getElementById('btn').textContent='⏸'; loop()} else {video.pause(); playing=false; document.getElementById('btn').textContent='▶';}}
function loop(){ if(!playing) return; document.getElementById('time').value=video.currentTime/dur*100; draw(); requestAnimationFrame(loop); }
function seek(v){ video.currentTime=dur*v/100; draw(); }
function legenda(){ const t=document.getElementById('txt').value||'LEGENDA'; textos.push({t,x:360,y:1050,s:56}); draw(); }
function loadAudio(e){ audioEl=new Audio(URL.createObjectURL(e.target.files[0])); audioEl.play(); }
function exportar(){
 const stream=canvas.captureStream(30); chunks=[]; rec=new MediaRecorder(stream,{mimeType:'video/webm'}); rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='video.webm'; a.click();}; rec.start(); video.currentTime=0; video.play(); setTimeout(()=>{rec.stop(); video.pause();}, dur*1000);
}
</script>
</body>
</html>
